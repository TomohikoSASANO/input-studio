version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../_local_data:/app/_local_data
      - ../assets:/app/assets
    environment:
      - PORT=8000
      - INPUTSTUDIO_LOCAL_DIR=/app/_local_data
    restart: unless-stopped
