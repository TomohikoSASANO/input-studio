<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PDF Input Studio</title>
    <meta name="description" content="PDF Input Studioは、PDFに文字入力して完成PDFを作成・保存できるWebサービスです。プロジェクトZIPで再開にも対応。" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://pdf-input-studio.kanazawa-application-support.jp/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PDF Input Studio" />
    <meta property="og:title" content="PDF Input Studio" />
    <meta property="og:description" content="PDF入力を速く正確に。ブラウザで編集から完成PDF出力まで完結。" />
    <meta property="og:url" content="https://pdf-input-studio.kanazawa-application-support.jp/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PDF Input Studio" />
    <meta name="twitter:description" content="PDF入力を速く正確に。ブラウザで編集から完成PDF出力まで完結。" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PDF Input Studio",
        "url": "https://pdf-input-studio.kanazawa-application-support.jp/",
        "publisher": {
          "@type": "Organization",
          "name": "kanazawa-application-support.jp",
          "url": "https://kanazawa-application-support.jp",
          "email": "SASANOtomohiko@outlook.jp"
        }
      }
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Web API wrapper (loaded before app.js for web version) -->
    <script>
      // Detect web mode
      (function() {
        const loadI18nThenApp = function() {
          const i18nScript = document.createElement('script');
          i18nScript.src = './i18n.js?v=1';
          i18nScript.onload = function() {
            const loadApp = function() {
              const appScript = document.createElement('script');
              appScript.src = './app.js?v=ads20260303';
              document.body.appendChild(appScript);
            };
            const adConfigScript = document.createElement('script');
            adConfigScript.src = '/ad-config.js?v=' + Date.now();
            adConfigScript.onload = loadApp;
            adConfigScript.onerror = loadApp;
            document.head.appendChild(adConfigScript);
          };
          document.head.appendChild(i18nScript);
        };

        if (!window.chrome?.webview && !window.pywebview) {
          // Web mode - load web_api.js first
          const webApiScript = document.createElement('script');
          webApiScript.src = '/web_api.js?v=' + Date.now();
          webApiScript.onload = function() {
            loadI18nThenApp();
          };
          document.head.appendChild(webApiScript);
        } else {
          // Desktop mode
          loadI18nThenApp();
        }
      })();
    </script>
  </body>
</html>
