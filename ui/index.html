<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Input Studio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Web API wrapper (loaded before app.js for web version) -->
    <script>
      // Detect web mode
      (function() {
        if (!window.chrome?.webview && !window.pywebview) {
          // Web mode - load web_api.js first
          const webApiScript = document.createElement('script');
          webApiScript.src = '/web_api.js';
          webApiScript.onload = function() {
            const appScript = document.createElement('script');
            appScript.src = './app.js?v=d13f54c';
            document.body.appendChild(appScript);
          };
          document.head.appendChild(webApiScript);
        } else {
          // Desktop mode - load app.js directly
          const appScript = document.createElement('script');
          appScript.src = './app.js?v=d13f54c';
          document.body.appendChild(appScript);
        }
      })();
    </script>
  </body>
</html>
