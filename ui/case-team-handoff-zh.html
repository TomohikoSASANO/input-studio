        <h1>案例：团队交接流程</h1>
        <p><strong>场景：</strong>持续进行中的 PDF 项目需要在不同操作员之间交接，同时保持作业连续性。</p>

        <h2>挑战</h2>
        <ul>
          <li>难以快速判断当前完成状态</li>
          <li>不同人员使用的标签命名不一致</li>
          <li>草稿与最终版容易混淆</li>
        </ul>

        <h2>流程</h2>
        <ol>
          <li>每个交接节点保存项目 ZIP</li>
          <li>按照共享命名规则整理标签</li>
          <li>同步检查清单与输出标准</li>
          <li>下一位操作员打开 ZIP，更新差分后再次保存</li>
        </ol>

        <h2>结果</h2>
        <ul>
          <li>项目状态可视化更清晰</li>
          <li>返工与核对成本降低</li>
          <li>人员变更时质量更稳定</li>
        </ul>
